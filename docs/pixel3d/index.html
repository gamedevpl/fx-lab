<!DOCTYPE html>
<html lang="en" data-fx="pixel3d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolution of 3D Pixel Art (1992–2023) — FX Lab | gamedev.pl</title>
<meta name="description" content="31 years of 3D pixel art live in WebGL2: 1992 Comanche Voxel Space, 1994 Donkey Kong Country pre-rendered sprites, 1997 Blood 3D voxels, 2018 Dead Cells 3D-to-2D cel sprites, 2018 Octopath Traveler HD-2D, 2018 Return of the Obra Dinn world-locked 1-bit dither, 2019 A Short Hike naive low-res 3D shimmer, and 2021–23 t3ssel8r texel-snapped sub-pixel camera.">
<link rel="canonical" href="https://gamedevpl.github.io/fx-lab/pixel3d/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamedevpl.github.io/fx-lab/pixel3d/">
<meta property="og:title" content="Evolution of 3D Pixel Art (1992–2023) — FX Lab">
<meta property="og:description" content="Why naive low-res 3D shimmers wildly and how texel-snapping + sub-pixel cameras fix it — plus Obra Dinn world-locked 1-bit dither, HD-2D, Blood voxels, and Comanche Voxel Space live in WebGL2.">
<meta property="og:image" content="https://gamedevpl.github.io/fx-lab/og-pixel3d.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Evolution of 3D Pixel Art (1992–2023) — FX Lab">
<meta name="twitter:description" content="8 eras of 3D pixel art live in WebGL2 with a draggable 4× pixel magnifier loupe — from Comanche Voxel Space and Obra Dinn 1-bit dither to t3ssel8r texel-snapped sub-pixel cameras.">
<meta name="twitter:image" content="https://gamedevpl.github.io/fx-lab/og-pixel3d.png">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="modulepreload" href="../src/app.js?v=5">
<link rel="modulepreload" href="../src/catalog.js">
<link rel="modulepreload" href="../src/icons.js">
<link rel="modulepreload" href="../src/gl-utils.js">
<link rel="modulepreload" href="../effects/pixel3d/index.js">
<link rel="modulepreload" href="../effects/pixel3d/shaders.js">
<link rel="stylesheet" href="../ask/ask.css">
<link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
<main>
  <canvas id="c" aria-label="Interactive WebGL2 3D pixel art viewport"></canvas>

  <header>
    <div class="brand">
      <button id="menuBtn" class="menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="siteMenu" aria-label="Menu">
        <svg viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="1" y="2" width="12" height="2" fill="currentColor"/>
          <rect x="1" y="6" width="12" height="2" fill="currentColor"/>
          <rect x="1" y="10" width="12" height="2" fill="currentColor"/>
        </svg>
      </button>
      <h1>FX <em>LAB</em></h1>
    </div>

    <nav>
      <button id="catalogBtn" class="fx-picker" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="fx-dot" id="pickerDot" aria-hidden="true"></span>
        <span class="fx-name" id="pickerName">All 20</span>
        <span class="fx-count" id="pickerCount">20/20</span>
        <span class="fx-caret" aria-hidden="true">▾</span>
      </button>
      <button id="lang" type="button" aria-label="Switch language">PL</button>
    </nav>
  </header>

  <section class="stage" id="stage">
    <div class="split-ui" id="splitUi" hidden>
      <div class="split-tags" id="splitTags">
        <span class="tag left" id="splitLeftTag"></span>
        <span class="tag right" id="splitRightTag"></span>
      </div>
      <div class="split-hit" id="splitHit" role="slider" tabindex="0" aria-label="Split comparison position" aria-valuemin="8" aria-valuemax="92" aria-valuenow="50">
        <div class="split-line"></div>
        <div class="split-grip" aria-hidden="true"></div>
      </div>
    </div>

    <article class="card" id="card">
      <p class="kicker" id="kicker"></p>
      <h2 id="stepTitle"></h2>
      <p id="stepNote"></p>
      <div class="row">
        <button id="prev" type="button" aria-label="Previous step">◀</button>
        <span id="count">01 / 08</span>
        <button id="next" type="button" aria-label="Next step">▶</button>
        <button id="splitBtn" type="button" aria-pressed="true">Split: ON</button>
        <button id="actionBtn" type="button" hidden></button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="resetBtn" type="button" title="Reset camera (R)">Reset</button>
      </div>
      <p class="hint" id="hintLine"></p>
      <p class="film" id="filmLine"></p>
    </article>
  </section>

  <footer>
    <div class="chapters" id="stepsBar" role="tablist" aria-label="Steps"></div>
  </footer>
</main>

<div class="catalog-backdrop" id="catalogModal" role="dialog" aria-modal="true" aria-labelledby="catalogTitle" hidden>
  <div class="catalog-box">
    <div class="catalog-head">
      <div>
        <h2 id="catalogTitle">Effects</h2>
        <p id="catalogSub"></p>
      </div>
      <button id="catalogClose" class="catalog-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="catalog-filters" id="catalogFilters" hidden>
      <input id="catalogSearch" type="search" autocomplete="off">
      <div class="catalog-cats" id="catalogCats"></div>
    </div>
    <div class="catalog-grid" id="catalogGrid"></div>
  </div>
</div>

<div id="nogl" hidden>
  <b id="noglTitle">WebGL2 is required</b>
  <p id="noglBody"></p>
</div>

<script type="module" src="../src/app.js?v=5"></script>
<script type="module">
if ("LanguageModel" in self || self.__fxLabModel) {
  import("../src/assistant.js").catch(() => {});
}
</script>
</body>
</html>
